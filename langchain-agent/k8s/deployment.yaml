apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-agent-sa
  namespace: flooding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infra-agent-role
subjects:
  - kind: ServiceAccount
    name: infra-agent-sa
    namespace: flooding
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-agent
  namespace: flooding
  labels:
    app: infra-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-agent
  template:
    metadata:
      labels:
        app: infra-agent
    spec:
      serviceAccountName: infra-agent-sa
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: agent
          image: gsmsv-1.yujun.kr:28104/flooding/infra-agent:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: infra-agent-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: infra-agent
  namespace: flooding
spec:
  selector:
    app: infra-agent
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30200
  type: NodePort
