# secret.yaml — TEMPLATE ONLY. Do NOT commit real values.
# Apply with: kubectl apply -f secret.yaml -n flooding
#
# Create the actual secret via:
#   kubectl create secret generic infra-agent-secret \
#     --from-literal=OPENAI_API_KEY=<your-key> \
#     --from-literal=SLACK_BOT_TOKEN=<xoxb-...> \
#     --from-literal=SLACK_APP_TOKEN=<xapp-...> \
#     --from-literal=SLACK_SIGNING_SECRET=<secret> \
#     --from-literal=SLACK_ALERT_CHANNEL=#infra-alerts \
#     -n flooding
apiVersion: v1
kind: Secret
metadata:
  name: infra-agent-secret
  namespace: flooding
type: Opaque
stringData:
  OPENAI_API_KEY: "<REPLACE_ME>"
  SLACK_BOT_TOKEN: "<REPLACE_ME>"
  SLACK_APP_TOKEN: "<REPLACE_ME>"
  SLACK_SIGNING_SECRET: "<REPLACE_ME>"
  SLACK_ALERT_CHANNEL: "#infra-alerts"
  OPENAI_MODEL: "gpt-4o"
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  LOKI_URL: "http://loki-stack.monitoring.svc:3100"
