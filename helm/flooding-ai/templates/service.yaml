apiVersion: v1
kind: Service
metadata:
  name: flooding-ai
  namespace: flooding
  labels:
    app: flooding-ai
spec:
  type: NodePort
  selector:
    app: flooding-ai
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
