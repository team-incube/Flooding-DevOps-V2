# Develop overrides — managed by CD for dev/develop branch
image:
  tag: "develop-34995b4"

replicaCount: 1

ingress:
  host: gsmsv-1.yujun.kr
  entryPoints:
    - dev

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false

env:
  SPRING_PROFILES_ACTIVE: dev

livenessProbe:
  port: 8080
  initialDelaySeconds: 90
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3
