# Develop overrides — managed by CD for dev/develop branch
image:
  tag: "develop-2ba7cef"

replicaCount: 1

ingress:
  host: api.flooding.kr
  entryPoints:
    - dev
  tls:
    secretName: api-flooding-kr-tls

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false

env:
  SPRING_PROFILES_ACTIVE: dev

livenessProbe:
  port: 8080
  initialDelaySeconds: 90
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3
