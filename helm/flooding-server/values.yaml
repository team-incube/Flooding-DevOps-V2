# Default values — overridden by values-prod.yaml / values-dev.yaml
# image.tag is automatically updated by the CD pipeline (cd.yml)

image:
  repository: gsmsv-1.yujun.kr:28104/flooding/flooding-server-v2
  tag: "master-e692b51"
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-pull-secret

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

ingress:
  host: api.flooding.kr
  extraHosts:
    - service.gsmsv.site
  entryPoints:
    - websecure
  tls:
    secretName: api-flooding-kr-tls

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  SPRING_PROFILES_ACTIVE: prod

livenessProbe:
  port: 8080
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
