---
- name: Apply flooding-server-secret (prod)
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: flooding-server-secret
      namespace: flooding
    type: Opaque
    stringData:
      DB_DRIVER: "org.postgresql.Driver"
      DB_URL: "jdbc:postgresql://postgres.flooding.svc:5432/flooding"
      DB_USERNAME: "flooding"
      DB_PASSWORD: "{{ vault_db_password }}"
      JPA_DDL_AUTO: "update"
      JPA_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
      JWT_SECRET: "{{ vault_jwt_secret }}"
      JWT_ACCESS_EXPIRATION: "{{ vault_jwt_access_expiration }}"
      JWT_REFRESH_EXPIRATION: "{{ vault_jwt_refresh_expiration }}"
      OAUTH_CLIENT_ID: "{{ vault_oauth_client_id }}"
      OAUTH_CLIENT_SECRET: "{{ vault_oauth_client_secret }}"
      REDIS_HOST: "redis.flooding.svc"
      REDIS_PORT: "6379"
      DATAGSM_OPEN_API_KEY: "{{ vault_datagsm_open_api_key }}"
      DATAGSM_NEIS_MEALS_BASE_URL: "https://openapi.datagsm.kr/"
      DATAGSM_NEIS_MEALS_API_KEY: "{{ vault_datagsm_neis_meals_api_key }}"
      NEIS_TIMETABLE_API_KEY: "{{ vault_neis_timetable_api_key }}"
      NEIS_OPENAPI_TIMETABLE_BASE_URL: "https://open.neis.go.kr/"
      NEIS_OPENAPI_TIMETABLE_API_KEY: "{{ vault_neis_openapi_timetable_api_key }}"
      AI_CHATBOT_URL: "http://flooding-ai.flooding.svc:8000"
      AI_SONG_URL: "http://flooding-ai.flooding.svc:8000"
      FILE_UPLOAD_DIR: "/app/uploads"
      FILE_BASE_URL: "https://prod.flooding.kr/"
      R2_BUCKET: "flooding-bucket"
      R2_ENDPOINT: "https://1499f1ef89652b364430eff163d470bd.r2.cloudflarestorage.com/"
      R2_ACCESS_KEY: "415dd75e0090418aa1d2362dd7191ad7"
      R2_SECRET_KEY: "447136a749a4efe25a1f2667897fb92fc495b75406da11936788d8dff9932c68"
      R2_PUBLIC_BASE_URL: "https://pub-2e450fd29a674f2ab950d5bcfab363cc.r2.dev/"
    EOF
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

